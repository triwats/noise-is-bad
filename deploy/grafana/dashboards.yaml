apiVersion: 1

# The public demo shows a chosen subset of ../provisioning/dashboards, mounted
# file by file in compose.yaml. `states` and `recording` exist for the e2e suite
# and the README recording, so they stay off the public box.
providers:
  - name: 'noise is bad.'
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 3600
    options:
      path: /etc/grafana/dashboards
