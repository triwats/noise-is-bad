# noise is bad.: the project site at https://noiseisbad.triwats.com/ and the
# public demo at https://noiseisbad.triwats.com/demo/
#
# Read-only, anonymous Grafana showing the panel, behind Caddy, reached only
# through a Cloudflare Tunnel. Nothing publishes a port: cloudflared dials out
# to Cloudflare, so the server needs no open inbound ports at all. The pretend
# estate (with its control page) and Prometheus sit on an internal network
# with no way in from outside and no way out.
#
# Run from this directory:  docker compose up -d
# Settings live in .env (copy .env.example). See README.md.

name: noise-is-bad-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # The way in. Holds an outbound connection to Cloudflare and passes each
  # request to Caddy. The token in .env is the only secret in the stack, and
  # it lives on the server alone.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.11.1}
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [edge]
    depends_on: [caddy]
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  # The gatekeeper: serves the site, sends /demo/ to Grafana, blocks the
  # paths a viewer has no business on. Plain HTTP on the internal network;
  # Cloudflare does the HTTPS.
  caddy:
    image: caddy:${CADDY_VERSION:-2.10.2}-alpine
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 100MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      site:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  # Builds the project site into the site volume, then exits. Skips the build
  # when nothing the site is made from has changed. See build-site.sh.
  site:
    build: ./site
    image: noise-is-bad-site-builder:local
    restart: 'no'
    command: ['bash', '/repo/deploy/build-site.sh']
    network_mode: none
    volumes:
      - ..:/repo:ro
      - site:/site
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  # Puts the panel into the plugins volume, then exits. See fetch-plugin.sh.
  plugin:
    image: alpine:3.22
    restart: 'no'
    command: ['sh', '/fetch-plugin.sh']
    environment:
      PLUGIN_VERSION: ${PLUGIN_VERSION:-0.0.1}
      PLUGIN_URL: ${PLUGIN_URL:-}
      PLUGIN_SHA256: ${PLUGIN_SHA256:-}
    volumes:
      - ./fetch-plugin.sh:/fetch-plugin.sh:ro
      - plugins:/plugins
    networks: [edge]
    logging: *logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    restart: unless-stopped
    depends_on:
      plugin:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    environment:
      GOMEMLIMIT: 400MiB
      GF_LOG_LEVEL: warn
      GF_SERVER_DOMAIN: ${DOMAIN:-noiseisbad.triwats.com}
      GF_SERVER_ROOT_URL: ${ROOT_URL:-https://noiseisbad.triwats.com/demo/}
      # The site has the root; Grafana lives under /demo/.
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_PATHS_PLUGINS: /var/lib/grafana-plugins

      # Anyone may look; nobody may sign in, sign up or change anything.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: 'true'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_DISABLE_SIGNOUT_MENU: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_USERS_VIEWERS_CAN_EDIT: 'false'
      # No admin account exists at all, so there is no password to guess.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'

      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SECURITY_COOKIE_SECURE: 'true'
      # The project site may iframe the demo; nobody else may.
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_SECURITY_CONTENT_SECURITY_POLICY: 'true'
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;
        object-src 'none'; font-src 'self' data:; style-src 'self' 'unsafe-inline' blob:;
        img-src 'self' data: blob:; base-uri 'self'; connect-src 'self';
        manifest-src 'self'; media-src 'none'; form-action 'self';
        frame-ancestors 'self' ${EMBED_ORIGINS:-https://noiseisbad.triwats.com}

      # Features a read-only wallboard does not need.
      GF_EXPLORE_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_SNAPSHOTS_ENABLED: 'false'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_PUBLIC_DASHBOARDS_ENABLED: 'false'
      GF_QUERY_HISTORY_ENABLED: 'false'
      GF_PROFILE_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_LIVE_MAX_CONNECTIONS: '0'
      GF_METRICS_ENABLED: 'false'

      # Nothing phones home, nothing is installed behind our back.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      # This plugin is unsigned until the catalog accepts it. Allow it, and only it.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: triwats-noiseisbad-panel

      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - plugins:/var/lib/grafana-plugins:ro
      - ../provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      # The dashboards worth showing the public, straight from the repository.
      - ../provisioning/dashboards/dashboard.json:/etc/grafana/dashboards/dashboard.json:ro
      - ../provisioning/dashboards/prometheus.json:/etc/grafana/dashboards/prometheus.json:ro
      - ../provisioning/dashboards/sloth.json:/etc/grafana/dashboards/sloth.json:ro
      - ../provisioning/dashboards/quiet.json:/etc/grafana/dashboards/quiet.json:ro
      - ../provisioning/dashboards/transitions.json:/etc/grafana/dashboards/transitions.json:ro
    networks: [edge, estate]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3000/demo/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # The pretend shop. Its control page on :9101 is reachable only from inside
  # the estate network, so visitors can watch it but never break it.
  exporter:
    build: ../demo/exporter
    image: noise-is-bad-exporter:local
    restart: unless-stopped
    networks: [estate]
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=512MB
      - --query.timeout=10s
      - --query.max-samples=5000000
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ../demo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [estate]
    depends_on: [exporter]
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

networks:
  # cloudflared, Caddy and Grafana. Has internet access, for the tunnel and the plugin zip.
  edge: {}
  # Grafana, Prometheus and the exporter. No internet, no published ports.
  estate:
    internal: true

volumes:
  caddy-data: {}
  caddy-config: {}
  grafana-data: {}
  plugins: {}
  prometheus-data: {}
  site: {}
