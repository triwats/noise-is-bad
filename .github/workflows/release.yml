# Builds the plugin on a version tag and attaches the zip to a GitHub release.
# (See https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
#
# Signing: leave GRAFANA_ACCESS_POLICY_TOKEN unset until Grafana's catalog review
# accepts the plugin. Until then the release ships unsigned, which is what the
# submission expects. Once accepted, create an access policy token with the
# plugins:write scope on grafana.com, save it as that repository secret, and tag
# again: the next release is signed with no change here.
name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0

permissions: read-all

jobs:
  release:
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          node-version: '24'
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
