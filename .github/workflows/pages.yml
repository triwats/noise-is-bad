name: Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'demo/recording/**'
      - 'src/img/logo.svg'
      - 'src/render/brandData.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build
        run: ./site/build.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
