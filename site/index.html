<!doctype html>
<!-- The frame around the README: site/render.cjs puts README.md where it says README below. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>noise is bad.</title>
    <meta
      name="description"
      content="A Grafana panel for the office television. It answers one question from across the room: how bad are things right now?"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://noiseisbad.triwats.com/" />
    <link rel="icon" href="media/logo.svg" type="image/svg+xml" />
    <meta property="og:title" content="noise is bad." />
    <meta
      property="og:description"
      content="How bad are things right now? A Grafana panel for the office television."
    />
    <meta property="og:url" content="https://noiseisbad.triwats.com/" />
    <meta property="og:image" content="https://noiseisbad.triwats.com/media/noise-is-bad.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The launch video: its YouTube ID (the 11 characters after "v=") goes in content. It then replaces the
      README's demo clip at the top, embedded from youtube-nocookie.com so nothing tracks a visitor until they
      press play. Until then the recorded demo stands in, so the page is never empty.
    -->
    <meta name="launch-video" content="" />
    <link rel="preload" href="media/archivo-black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <a class="lockup" href="./" aria-label="noise is bad., home">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="media/lockup-dark.svg" />
          <img src="media/lockup-light.svg" alt="noise is bad." width="694" height="217" />
        </picture>
      </a>
      <nav aria-label="Project">
        <a href="demo/">Live demo</a>
        <a href="https://github.com/triwats/noise-is-bad">Source</a>
        <a href="https://github.com/triwats/noise-is-bad/blob/main/docs/getting-started.md">Docs</a>
        <a href="#support">Support</a>
      </nav>
    </header>

    <main>
      <!-- README -->
    </main>

    <footer>
      <p>
        Made by <a href="https://triwats.com">Tristan Watson</a>. Apache-2.0.
        <a href="https://github.com/triwats/noise-is-bad/blob/main/THIRD_PARTY_NOTICES.md">Credits</a>.
      </p>
    </footer>
    <script>
      // The launch video, once it has an ID. Anything that is not a YouTube ID is ignored, so a typo leaves the clip.
      const launch = document.querySelector('.launch');
      const id = launch && document.querySelector('meta[name="launch-video"]').content;
      if (id && /^[A-Za-z0-9_-]{11}$/.test(id)) {
        const frame = document.createElement('iframe');
        frame.src = `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
        frame.title = 'noise is bad., the launch video';
        frame.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        frame.loading = 'lazy';
        launch.querySelector('video').replaceWith(frame);
      }

      // Respect a request for less motion: hold the clips still and hand the viewer the controls.
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (const v of document.querySelectorAll('video')) {
          v.removeAttribute('autoplay');
          v.pause();
          v.controls = true;
        }
      }
    </script>
  </body>
</html>
